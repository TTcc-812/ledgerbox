[project]
name = "ledgerbox"
version = "0.1.0"
description = "WeChat / Alipay / CMB bill ingest with transfer detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = [
  "pyyaml>=6.0",
  "pyzipper>=0.3.6",
  "openpyxl>=3.1.0",
]

[project.scripts]
ledgerbox = "ledgerbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
